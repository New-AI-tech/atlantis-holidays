<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlantis Holidays & Wellness - Proposal Generator</title>

    <!-- Client-Side Document Processing Libraries (Loaded via CDN in explicit order) -->
    <!-- 1. PizZip must load FIRST -->
    <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.min.js"></script>
    <!-- 2. Docxtemplater must load SECOND -->
    <script src="https://unpkg.com/docxtemplater@3.37.11/build/docxtemplater.js"></script>
    <!-- 3. FileSaver loads THIRD -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 2rem;
            background: #f8f9fa;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        h1,
        h2 {
            color: #0a2540;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .item-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            align-items: center;
        }

        .item-row input:nth-child(1) {
            flex: 3;
        }

        .item-row input:nth-child(2) {
            flex: 1;
        }

        .item-row input:nth-child(3) {
            flex: 1;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            background: #0066cc;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s ease-in-out;
        }

        .btn:hover {
            background: #004b99;
        }

        .btn-secondary {
            background: #6c757d;
            font-size: 0.85rem;
            padding: 0.4rem 0.8rem;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
            padding: 0.5rem 0.75rem;
            font-size: 0.85rem;
        }

        .btn-danger:hover {
            background: #bd2130;
        }

        .section-box {
            border: 1px solid #e9ecef;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            background: #fdfdfd;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Atlantis Holidays & Wellness</h1>
        <p>Generate professional proposals directly in your browser.</p>
        <hr style="margin-bottom: 1.5rem; border: 0; border-top: 1px solid #eee;">

        <form id="proposalForm">
            <!-- General Information -->
            <h2>1. General Information</h2>
            <div class="form-group">
                <label for="event_name">Event / Client Name</label>
                <input type="text" id="event_name" placeholder="e.g., Executive VIP Wellness Retreat" required>
            </div>
            <div class="form-group">
                <label for="event_dates">Dates</label>
                <input type="text" id="event_dates" placeholder="e.g., November 10 - November 15, 2026" required>
            </div>
            <div class="form-group">
                <label for="venue">Venue / Location</label>
                <input type="text" id="venue" placeholder="e.g., Atlantis The Royal, Dubai" required>
            </div>

            <!-- Accommodation & Hotel Services -->
            <h2>2. Accommodation & Hotel Services</h2>
            <div class="section-box">
                <div id="hotelContainer"></div>
                <button type="button" class="btn btn-secondary" onclick="addRow('hotelContainer', 'hotel')">+ Add Room /
                    Service</button>
            </div>

            <!-- Transportation -->
            <h2>3. Transportation</h2>
            <div class="section-box">
                <div id="transContainer"></div>
                <button type="button" class="btn btn-secondary" onclick="addRow('transContainer', 'trans')">+ Add
                    Transport Service</button>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn" style="width: 100%; font-size: 1.1rem; margin-top: 1rem;">Generate &
                Download .DOCX</button>
        </form>
    </div>

    <script>
        /**
         * Appends a new item row into a specified container element.
         * @param {string} containerId - The ID of the target container DIV.
         * @param {string} prefix - Class name prefix ('hotel' or 'trans').
         */
        function addRow(containerId, prefix) {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = 'item-row';
            div.innerHTML = `
            <input type="text" placeholder="Description / Item Name" class="${prefix}-name" required>
            <input type="number" placeholder="Qty" class="${prefix}-qty" value="1" min="1" step="any" required>
            <input type="number" placeholder="Rate (AED/USD)" class="${prefix}-rate" value="0" min="0" step="any" required>
            <button type="button" class="btn btn-danger" onclick="this.parentElement.remove()" title="Delete Row">✕</button>
        `;
            container.appendChild(div);
        }

        /**
         * Reads input fields matching a section prefix and calculates line/section totals.
         * @param {string} prefix - Class prefix ('hotel' or 'trans').
         * @returns {Object} Object containing structured items array and numeric section total.
         */
        function parseSection(prefix) {
            const names = document.querySelectorAll(`.${prefix}-name`);
            const quantities = document.querySelectorAll(`.${prefix}-qty`);
            const rates = document.querySelectorAll(`.${prefix}-rate`);

            let items = [];
            let sectionTotal = 0;

            for (let i = 0; i < names.length; i++) {
                const name = names[i].value.trim();
                const qty = parseFloat(quantities[i].value) || 0;
                const rate = parseFloat(rates[i].value) || 0;
                const total = qty * rate;

                if (name !== "") {
                    sectionTotal += total;
                    items.push({
                        name: name,
                        quantity: qty.toLocaleString('en-US'),
                        rate: rate.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
                        total: total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
                    });
                }
            }
            return { items, sectionTotal };
        }

        // Initialize default rows on page load
        window.addEventListener('DOMContentLoaded', () => {
            addRow('hotelContainer', 'hotel');
            addRow('transContainer', 'trans');
        });

        // Form submission handling
        document.getElementById('proposalForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            // Verify library loading
            if (typeof window.PizZip === 'undefined' || typeof window.docxtemplater === 'undefined') {
                alert("Error: Processing libraries (PizZip/Docxtemplater) are missing. Check your script tags.");
                return;
            }

            const hotelData = parseSection('hotel');
            const transData = parseSection('trans');
            const grandTotalValue = hotelData.sectionTotal + transData.sectionTotal;

            const dataContext = {
                company_name: "Atlantis Holidays & Wellness",
                event_name: document.getElementById('event_name').value,
                event_dates: document.getElementById('event_dates').value,
                venue: document.getElementById('venue').value,
                hotel_services: hotelData.items,
                transportation: transData.items,
                grand_total: grandTotalValue.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
                footer_text: "Atlantis Holidays & Wellness — Curated Luxury Experiences"
            };

            try {
                // CACHE-BUSTING FIX: Add a unique timestamp parameter (?t=...) to bypass browser cache
                const cacheBuster = new Date().getTime();
                const response = await fetch(`template.docx?t=${cacheBuster}`, {
                    cache: "no-store" // Requests fresh copy directly from server
                });

                if (!response.ok) {
                    throw new Error("Could not find 'template.docx' in project directory.");
                }
                const templateBuffer = await response.arrayBuffer();

                // Process Word document
                const zip = new window.PizZip(templateBuffer);
                const doc = new window.docxtemplater(zip, {
                    paragraphLoop: true,
                    linebreaks: true,
                });

                // Render template with user data
                doc.render(dataContext);

                // Generate blob output
                const outputBlob = doc.getZip().generate({
                    type: "blob",
                    mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
                });

                // UNIQUE FILENAME FIX: Append current timestamp so files don't overwrite
                const clientName = dataContext.event_name.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                const timestamp = new Date().toISOString().replace(/[:.-]/g, '_');
                const fileName = `Proposal_${clientName}_${timestamp}.docx`;

                saveAs(outputBlob, fileName);

            } catch (error) {
                console.error("Docxtemplater Error Details:", error);
                if (error.properties && error.properties.errors) {
                    const detailedErrors = error.properties.errors.map(e => e.message).join("\n");
                    alert("Template XML Tag Error:\n" + detailedErrors);
                } else {
                    alert("Error generating document: " + error.message);
                }
            }
        });
    </script>

</body>

</html>
